services:
  web:
    build: .              # build the image using the Dockerfile in this folder
    container_name: hello-docker-app
    ports:
      - "5000:5000"       # host_port:container_port
    volumes:
      - .:/app            # sync local code into the container live (great for development)
    environment:
      - FLASK_ENV=development
    restart: unless-stopped
